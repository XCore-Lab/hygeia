<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="A skin area is scanned and noted, a short anonymous chat follows, and the person is directed to a clinic">
<defs>
 <clipPath id="blG"><path d="M164 52 C238 48 288 100 285 172 C282 240 232 288 162 286 C92 284 46 236 48 168 C50 100 96 55 164 52 Z"/></clipPath>
 <clipPath id="lensG"><circle r="52"/></clipPath>
 <linearGradient id="skG" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0%" stop-color="#E3C9AC"/><stop offset="100%" stop-color="#CBB79C"/></linearGradient>
</defs>
<style>
 /* master cycle: 14s */
 #glass{animation:drift 14s cubic-bezier(.45,0,.55,1) infinite}
 @keyframes drift{0%{transform:translate(118px,118px)}14%,96%{transform:translate(206px,192px)}100%{transform:translate(118px,118px)}}
 #arc{fill:none;stroke:#00A36C;stroke-width:4.6;stroke-linecap:round;stroke-dasharray:390;stroke-dashoffset:390;
      transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;animation:arc 14s ease-in-out infinite}
 @keyframes arc{0%,15%{stroke-dashoffset:390;opacity:1}27%{stroke-dashoffset:0;opacity:1}33%{opacity:0}100%{stroke-dashoffset:390;opacity:0}}
 #ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 14s ease-out infinite}
 @keyframes ring{0%,27%{opacity:0;transform:scale(.6)}33%{opacity:1;transform:scale(1)}36%{transform:scale(1.05)}40%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
 #noted{opacity:0;transform-box:fill-box;transform-origin:center;animation:noted 14s ease-out infinite}
 @keyframes noted{0%,30%{opacity:0;transform:scale(.6)}36%{opacity:1;transform:scale(1)}92%{opacity:1}97%,100%{opacity:0}}
 .conn{fill:none;stroke:#40E0D0;stroke-width:2.8;stroke-dasharray:5 8;stroke-linecap:round;opacity:0}
 #c1{animation:cf 14s ease-out infinite}
 @keyframes cf{0%,34%{opacity:0}40%,92%{opacity:.6}97%,100%{opacity:0}}
 #c2{animation:cf2 14s ease-out infinite}
 @keyframes cf2{0%,68%{opacity:0}74%,92%{opacity:.6}97%,100%{opacity:0}}
 .bb{opacity:0;transform-box:fill-box;animation:bb 14s ease-out infinite}
 #b1{transform-origin:0% 100%} #b2{transform-origin:100% 100%;animation-name:bb2} #b3{transform-origin:0% 100%;animation-name:bb3}
 @keyframes bb{0%,40%{opacity:0;transform:translateY(7px) scale(.9)}45%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
 @keyframes bb2{0%,49%{opacity:0;transform:translateY(7px) scale(.9)}54%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
 @keyframes bb3{0%,67%{opacity:0;transform:translateY(7px) scale(.9)}72%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
 #tw{animation:tw 14s linear infinite}
 @keyframes tw{0%,56%{opacity:0}57%,66%{opacity:1}67%,100%{opacity:0}}
 #tw circle{animation:tp 1s ease-in-out infinite}
 #tw circle:nth-of-type(2){animation-delay:.18s} #tw circle:nth-of-type(3){animation-delay:.36s}
 @keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
 #pin{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pn 14s ease-out infinite}
 @keyframes pn{0%,76%{opacity:0;transform:translateY(-20px) scale(.86)}82%{opacity:1;transform:none}86%{transform:scale(1.05)}90%,92%{transform:none;opacity:1}97%,100%{opacity:0}}
 #halo{fill:none;stroke:#00A36C;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:hl 14s ease-out infinite}
 @keyframes hl{0%,80%{opacity:0;transform:scale(.55)}86%{opacity:.5}94%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
 #gnd{opacity:0;animation:gn 14s ease-out infinite}
 @keyframes gn{0%,78%{opacity:0}84%,92%{opacity:.15}97%,100%{opacity:0}}
 @media (prefers-reduced-motion:reduce){
   *{animation:none!important}
   #glass{transform:translate(206px,192px)}
   #arc,#tw{display:none}
   #ring,#noted,#c1,#c2,.bb,#pin{opacity:1} #halo{opacity:0} #gnd{opacity:.15}
 }
</style>

