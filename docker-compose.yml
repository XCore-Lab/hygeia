services:
  hygeia:
    build: .
    image: hygeia
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # checkpoints (shipped) + hf_cache (downloaded by download_models.py)
    environment:
      - VLM_BACKEND=qwen3vl
      - VAIS_BACKEND=fusion
      - RELEVANCE_BACKEND=vlm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
